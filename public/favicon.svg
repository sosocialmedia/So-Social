<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700&amp;family=Inter:wght@500;600;700&amp;display=swap');
      .bg { fill: #E6E4DD; }
      .text-so {
        font-family: 'Playfair Display', Didot, 'Bodoni MT', 'Times New Roman', Georgia, serif;
        font-size: 195px;
        font-weight: 700;
        fill: #111111;
        text-anchor: middle;
        letter-spacing: -2px;
      }
      .text-social {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 38px;
        font-weight: 600;
        fill: #111111;
        text-anchor: middle;
        letter-spacing: 14px;
      }
    </style>
  </defs>
  <!-- Background matching official brand linen palette -->
  <rect width="512" height="512" class="bg" rx="96"/>
  
  <!-- "SO" in high-contrast editorial serif -->
  <text x="256" y="275" class="text-so">SO</text>
  
  <!-- "SOCIAL" in tracked geometric typography -->
  <text x="263" y="336" class="text-social">SOCIAL</text>
</svg>
